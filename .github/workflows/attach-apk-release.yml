name: Attach APK to Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  upload-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload neon-storm.apk to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || 'v1.0.0' }}
        run: |
          gh release upload "$TAG" neon-storm.apk --clobber
